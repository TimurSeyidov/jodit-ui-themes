name: Publish

# Publish to npm when a version tag is pushed (`npm version <patch|minor|major>`
# + `git push --follow-tags`). Uses npm trusted publishing (OIDC): no token,
# provenance is attached automatically. The trusted publisher (this
# repository + publish.yml) is configured in the package settings on
# npmjs.com.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `registry-url`: it writes an .npmrc with a placeholder token, and npm
      # then tries that token instead of trusted publishing (E404 on publish)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Trusted publishing needs npm 11.5.1 or newer
      - run: npm install -g npm@^11.5.1

      - run: npm ci

      - name: Tag matches package.json version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json $version"
            exit 1
          fi

      - run: npm run build

      - name: Generated files are up to date
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated CSS is out of date. Run 'npm run build' and commit the result."
            git status --porcelain
            exit 1
          fi

      # A version published by hand (the very first one) is skipped, not failed
      - name: Publish unless this version is already on npm
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already published, nothing to do"
          else
            npm publish --access public
          fi
